name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore-runner:
    name: Explore GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display CI message
        run: echo "Running my first CI workflow"

      - name: Display working directory
        run: pwd

      - name: Display Python version
        run: python --version

      - name: List repository files
        run: ls -la
