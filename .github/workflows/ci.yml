name: CI

run-name: CI for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Check code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --require-hashes \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --require-hashes \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build-image:
    name: Build and test Docker image
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag production-cicd-lab:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name production-cicd-lab \
            --publish 8000:8000 \
            production-cicd-lab:${{ github.sha }}

      - name: Wait for application
        run: |
          for attempt in {1..10}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health; then
              echo
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/10"
            sleep 2
          done

          echo "Application did not become healthy"
          exit 1

      - name: Verify version endpoint
        run: |
          curl \
            --fail \
            --show-error \
            http://127.0.0.1:8000/version

      - name: Verify non-root container user
        run: docker exec production-cicd-lab id

      - name: Display container logs
        if: always()
        run: docker logs production-cicd-lab || true

      - name: Remove test container
        if: always()
        run: docker rm --force production-cicd-lab || true