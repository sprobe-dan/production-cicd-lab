name: CI

run-name: CI for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  IMAGE_NAME: ghcr.io/sprobe-dan/production-cicd-lab

jobs:
  quality:
    name: Check code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --require-hashes \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --require-hashes \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build-image:
    name: Build and test Docker image
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --tag production-cicd-lab:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name production-cicd-lab \
            --publish 8000:8000 \
            production-cicd-lab:${{ github.sha }}

      - name: Wait for application
        run: |
          for attempt in {1..10}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health; then
              echo
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/10"
            sleep 2
          done

          echo "Application did not become healthy"
          exit 1

      - name: Verify version endpoint
        run: |
          curl \
            --fail \
            --show-error \
            http://127.0.0.1:8000/version

      - name: Verify non-root container user
        run: docker exec production-cicd-lab id

      - name: Save verified image
        if: github.event_name == 'push' && github.ref =='refs/heads/main'
        run: |
          docker save \
            --output container-image.tar \
            production-cicd-lab:${{ github.sha }}

      - name: Upload verified image
        if: github.event_name == 'push' && github.ref =='refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ github.sha }}
          path: container-image.tar
          compression-level: 0
          retention-days: 1

      - name: Display container logs
        if: always()
        run: docker logs production-cicd-lab || true

      - name: Remove test container
        if: always()
        run: docker rm --force production-cicd-lab || true

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Verified image
        uses: actions/download-artifact@v4
        with:
          name: container-image-${{ github.sha }}

      - name: Load verified image
        run: docker load --input container-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish image
        run: |
          docker tag \
            production-cicd-lab:${{ github.sha }} \
            ${IMAGE_NAME}:${{ github.sha }}

          docker tag \
            production-cicd-lab:${{ github.sha }} \
            ${IMAGE_NAME}:main

          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:main