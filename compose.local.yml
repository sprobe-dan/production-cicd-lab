name: production-cicd-lab-local

services:
  db:
    image: postgres:17-alpine
    container_name: production-cicd-lab-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: cicd_lab
      POSTGRES_USER: cicd_user
      POSTGRES_PASSWORD: cicd_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_local_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cicd_user -d cicd_lab
      interval: 5s
      timeout: 5s
      retries: 10

    mem_limit: 256m

volumes:
  postgres_local_data: