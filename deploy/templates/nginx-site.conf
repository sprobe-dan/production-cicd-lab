# Replace YOUR_DOMAIN and YOUR_APP_PORT. Use separate server blocks for
# staging (8000) and production (8001) on distinct hostnames.
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:YOUR_APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # /health and /ready pass through the location above without rewriting.
    # For HTTPS, obtain a certificate and add TLS/redirect configuration here.
}
